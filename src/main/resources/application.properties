spring.application.name=efms
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional tuning
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Mail Server Configuration
spring.mail.host=${MAIL_HOST:mail.werya.be}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:efms@werya.be}
spring.mail.password=${MAIL_PASS}
spring.mail.protocol=${MAIL_PROTOCOL:smtps}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}

# Spring Data Page Serialization Mode (suppress warning and enforce stable DTO serialization)
spring.data.web.pageable.page-serialization-mode=via-dto
