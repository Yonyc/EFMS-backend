spring.application.name=efms
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional tuning
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Batch-fetch lazy associations/collections in IN(...) chunks instead of one query each (kills N+1
# when mapping many parcels -> parcelPeriods -> period/cultureType on the viewport endpoint).
spring.jpa.properties.hibernate.default_batch_fetch_size=200
# Mail Server Configuration
spring.mail.host=${MAIL_HOST:mail.werya.be}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:efms@werya.be}
spring.mail.password=${MAIL_PASS}
spring.mail.protocol=${MAIL_PROTOCOL:smtps}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}

# Multipart upload limits (avatars, product/tool pictures, attachments, Geofolia imports)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# PHYTO catalog files directory (relative to backend working dir or absolute)
efms.phyto.sftp.host=${PHYTO_SFTP_HOST:ftp.health.belgium.be}
efms.phyto.sftp.port=${PHYTO_SFTP_PORT:22}
efms.phyto.sftp.user=${PHYTO_SFTP_USER:ftppanama-opendata}
efms.phyto.sftp.password=${PHYTO_SFTP_PASSWORD:guest}
efms.phyto.sftp.remote-dir=${PHYTO_SFTP_REMOTE_DIR:/files}
